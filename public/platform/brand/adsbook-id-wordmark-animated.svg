  <title>adsbook.id</title>
  <style>
    .rise { transform-box: fill-box; transform: translateY(105%); animation: rise .5s cubic-bezier(.2,.8,.2,1) forwards; }
    .l0 { animation-delay: 0ms; } .l1 { animation-delay: 40ms; } .l2 { animation-delay: 80ms; } .l3 { animation-delay: 120ms; } .l4 { animation-delay: 160ms; } .l5 { animation-delay: 200ms; } .l6 { animation-delay: 240ms; }
    .id { animation-delay: 1.0s; }
    .streak { opacity: 0; }
    .browser { animation: down .42s cubic-bezier(.5,0,.75,0) .42s forwards; }
    .server { animation: left .42s cubic-bezier(.5,0,.75,0) .42s forwards; }
    .dot { opacity: 0; animation: show .01s linear .84s forwards; }
    .lock { opacity: 0; fill: none; stroke: #2563EB; stroke-width: 15; stroke-linecap: square; transform-box: fill-box; transform-origin: center;
            animation: lock .26s cubic-bezier(.2,.8,.2,1) .84s forwards, release .3s ease-in 1.32s forwards; }
    @keyframes rise { to { transform: none; } }
    @keyframes down { from { opacity: 1; transform: translateY(-620px); } to { opacity: 1; transform: translateY(535px); } }
    @keyframes left { from { opacity: 1; transform: translateX(620px); } to { opacity: 1; transform: translateX(-535px); } }
    @keyframes show { to { opacity: 1; } }
    @keyframes lock { from { opacity: 0; transform: scale(1.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes release { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .rise { animation: none; transform: none; }
      .dot { animation: none; opacity: 1; }
      .streak, .lock { animation: none; opacity: 0; }
    }</style>
