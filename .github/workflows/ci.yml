name: CI

# This repository is the adsbook.id product. It deploys nothing.
#
# It previously carried a workflow that ran `wrangler deploy` on every push to
# main, against the resources of one specific install (permatamall.shop). That
# was correct for a store repository and dangerous here: adding a Cloudflare
# token to this repository's secrets would have made product development
# overwrite a live store.
#
# Deployment belongs to an install, from its own repository, against its own
# Worker, D1, KV, R2 and domain. See RELEASE.md.

# Every commit on every branch runs the whole gate, the isolation suites
# included (T-28: "the suite runs in CI on every commit").
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # The runner's cached 22.x can lag Astro's floor (22.23.3 < 22.23.4 on
          # 2026-11-02, which failed `astro check`); take the newest 22.x.
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and static analysis
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # T-28: cookie and cache isolation in a real browser, against the local
      # platform (workerd + provider stand-ins on loopback; no Cloudflare
      # account, no secret). Reuses the build above.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser isolation suite
        run: npm run test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
